# The Refdes documentation, built with Refdes.
#
# A pages-only project: no items, so no coverage, no design log, no traceability —
# just narrative markdown rendered with the same theme. This is what a project gets
# when it wants an overview page alongside its requirements.
#
# This file is the project marker and holds every project setting; the schema
# this project declares for itself lives in refdes-schema.yaml beside it.

site:
  title: "Refdes"
  out: ../_docs
  pages: ../docs

  # Generated images. `gen_examples.py` writes the vocabulary diagram here;
  # a markdown image naming a bare filename resolves against this list.
  # (Not named `assets`: a `site.assets:` directory is copied to
  # `_site/assets/<its own path>`, so a directory called `assets` lands at
  # `assets/assets/`.)
  assets:
    - images

  # Reading order. Anything not listed falls in after these, alphabetically.
  nav:
    - index
    - getting-started
    - concepts
    - standard-library
    - authoring
    - pages
    - markdown
    - blocks
    - ids
    - links
    - math
    - checks
    - design-log
    - coverage
    - change-tracking
    - multi-board
    - workspaces
    - lifecycle
    - parts
    - schema-reference
    - vocabulary
    - themes
    - cli-reference
    - output
    - troubleshooting
