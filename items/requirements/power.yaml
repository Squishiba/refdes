# Bulk authoring form: shared fields live in `defaults:`, so each requirement is
# one line of actual content. Items with no `id:` get one from `refdes id`.

defaults:
  type: requirement
  prefix: REQ-PWR
  owner: J. Bin
  tags: [power]
  status: accepted
  board: board-a   # folder predates the boards: registry; see refdes.yaml

items:
  - id: REQ-PWR-001
    text: The unit shall operate from an input supply of 9 V to 36 V.
    source: Customer spec rev D, §3.1

  - id: REQ-PWR-002
    text: The 3V3 rail shall supply 1.2 A continuous with less than 50 mV peak-to-peak ripple.
    source: Customer spec rev D, §3.4

  - id: REQ-PWR-003
    text: Converter efficiency shall exceed 90 % at half load.
    rationale: Drives the thermal budget in a sealed enclosure with no forced airflow.
    source: Derived from CON-THM-001.
    derives_from: [REQ-PWR-002]

  - id: REQ-PWR-004
    text: The 3V3 rail shall remain within regulation during a 12 V to 9 V input step.
    status: draft
    owner: A. Rivera
    history:
      fields:
        owner: ignore
      reason: "Owner rotates weekly during bring-up; not a meaningful change."

  # No id yet — `refdes id` will allocate REQ-PWR-005 and write it back here.
  - id: REQ-PWR-005
    text: The unit shall tolerate a sustained 40 V input transient for 100 ms.
    status: draft
