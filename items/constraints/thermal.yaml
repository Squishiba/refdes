defaults:
  type: bound
  prefix: BND-THM
  owner: J. Bin
  tags: [thermal]
  status: active
  board: board-a   # folder predates the boards: registry; see refdes.yaml

items:
  - id: BND-THM-001
    # Renamed from CON-THM-001 by `refdes standard upgrade --to 3` (hardware@3
    # renamed `constraint` to `bound`, prefix CON -> BND). The rename moves
    # structured references but never prose, so this records the old id here
    # instead: every "CON-THM-001" still written in a rationale, a source
    # note, or a sealed log entry keeps resolving, marked "(formerly
    # CON-THM-001)", without rewriting a single historical sentence.
    former_ids: [CON-THM-001]
    text: Board power density
    limit: "<= 0.15 W/in^2"
    rationale: >
      Natural convection only — the enclosure is sealed with no vents and no fan.
      Above this density the board exceeds 85 °C at the 55 °C ambient rating.
    source: Enclosure spec rev C, p.14

  - id: BND-THM-002
    text: Minimum converter efficiency
    limit: ">= 0.90"
    rationale: >
      Every point of efficiency below this pushes dissipation past what the
      enclosure can shed. Directly supports CON-THM-001.
    source: Thermal model TM-014
