# Refdes project configuration.
#
# Item types, links, and change-tracking policy come from the bundled standard
# dictionary below -- most people never need to touch that block. What's left
# here is site/id/units/boards config, plus the one field this project adds
# that the standard doesn't know about (log.board -- see the comment below).
# See docs/schema-reference.md and docs/design/standard-library.md.

site:
  title: "Example Board — Design Reference"
  out: _site

id:
  width: 3                      # REQ-PWR-004. Set generously now; changing it later is painful.
  ledger: .refdes/ids.yaml   # burned IDs are never reused

history:
  # Applied to any field that does not declare its own on_change.
  default: invalidate

# Named units to collapse derived results into, so V*A renders as "W" rather than
# "ampere * volt". Only single-symbol units belong here: a unit you wrote yourself,
# like in^2, is always left exactly as you wrote it.
units:
  preferred: [W, V, A, ohm, F, H, Hz, J, N, Pa, K, s, m, g]

  # House units. `mil` and `mils` already map to `thou` by default, because pint
  # reads a bare "mil" as the angular mil rather than a thousandth of an inch.
  aliases: {}

# The standard dictionary: requirement, bound, decision, test, component,
# log, plus the standard link vocabulary -- resolved live against the
# installed refdes package on every load, never copied into this file. See
# docs/design/standard-library.md for what it covers and why pinning a plain
# integer (not "latest") is the whole point.
standard:
  base: hardware
  version: 4
  presets: []

# The one field the standard doesn't know about: this project's log entries
# carry a hand-typed `board:` field predating the boards: registry below (see
# that registry's own comment). It shadows the reserved `board:` override --
# a type's own field always wins -- so that key scopes nothing on a log
# entry; the entries are board-scoped by living in items/board-a/, like
# everything else. Retiring the field would be tidier still, but it would
# change every entry's content hash, and log entries are sealed append-only.
# Everything else about `log` comes from the standard unchanged.
types:
  log:
    fields:
      board: { type: text, on_change: invalidate }

# Opt-in board registry for a family of boards sharing this project. Absent
# entirely, an item's board stays unset and the site is unaffected -- see
# docs/multi-board.md. A board is the first path segment under items/, matched
# against this registry, and overridable per item (or per file's defaults:)
# with the reserved `board:` key -- used below for Board A, whose items live in
# folders that predate this registry (items/requirements, items/constraints,
# items/decisions) rather than in items/board-a/. Board B is new enough to just
# live in items/board-b/ and needs no override.
#
# The one exception is the design log, which the override cannot reach: the
# `log` type declares its own `board` field, so it lives in items/board-a/ and
# is scoped by its path like Board B's items are.
#
# Board A declares no `token:` on purpose: its prefixes (REQ-PWR, BND-THM,
# DEC-PWR, TST-PWR) predate board tokens and were frozen before this registry
# existed, so there is no letter to check them against. See docs/ids.md on
# adopting board-token prefixes from the start next time.
boards:
  board-a:
    label: "Board A"
  board-b:
    label: "Board B"
    token: B
