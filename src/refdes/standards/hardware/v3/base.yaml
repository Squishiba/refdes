# The refdes standard dictionary — "hardware" base, version 3.
#
# Shipped inside the refdes package. Byte-identical forever once released: a
# project pinning `standard: {base: hardware, version: 3}` gets exactly this
# file, unchanged by any future refdes upgrade. See
# docs/design/standard-library.md for the full design discussion behind every
# choice here — this file is deliberately un-annotated beyond what a reader
# needs to trust that it matches the spec, since the spec is the place to
# argue about it, not this file.
#
# Changed from v2, in three parts, arriving together as one version because
# none was ever published on its own:
#
# 1. A new link verb: `governed_by` (inverse `governs`), authored on
#    `requirement`, targeting `[requirement, bound]`. Fills a real gap
#    `refines` and `constrained_by` both leave open: "this specific fact
#    must comply with a general rule stated elsewhere" is neither "a
#    narrower version of the same statement" (`refines` — same category of
#    thing, different altitude) nor "a machine-checkable numeric limit"
#    (`constrained_by` — the limit-bearing case, where a bound and `checks:`
#    are actually involved). Named and shaped to match the convention
#    `constrained_by`/`constrains` and `blocked_by`/`blocks` already
#    establish twice: authored from the *affected* item's side using the
#    passive form, with the active form computed as the backlink. Widened to
#    also target `bound` (not just `requirement`) for the same reason
#    `constrained_by` and `refines` both already do: a general rule worth
#    complying with is stated exactly as often as a bound as a requirement.
#
# 2. `satisfies` widens to `[requirement, bound]` on both `decision` and
#    `component` (was `[requirement]` on each) — a bound could be verified
#    or addressed, but never *satisfied*, which meant it could never be
#    fully covered by design work no matter how much existed. Coverage is
#    computed strictly from the `addressed_by`/`satisfied_by`/`verified_by`
#    backlinks (`build.compute_coverage`); `constrained_by`/`constrains`
#    contributes to none of them and stays a traceability-only edge (see
#    "Which links feed coverage" in docs/coverage.md) — this widening is
#    what actually closes the gap, not a documentation fix. `component`
#    also gains `constrained_by: [bound]` (it previously had no path to a
#    bound at all) and a `checks:` field, so a component can demonstrate
#    compliance with a bound directly rather than a `decision` having to be
#    invented purely to host the check.
#
# 3. `requirement.text` and `bound.text` merge into `body:` — not the
#    `requirement.text -> title` rename an earlier, retired proposal
#    considered, but a broader unification: `title` and `body` become the
#    only free-prose fields any type carries. `title` becomes OPTIONAL on
#    these two types, falling back exactly as `Item.title` already does for
#    every other type missing one — a requirement stays one field to write
#    (`body:` — see below), and gains a short label only when the sentence
#    is long enough to want one in a table. `test.method` folds into
#    `body:` too, on the same reasoning: free prose with nothing mechanical
#    depending on it, same role `body:` already plays everywhere else.
#    `method:` was never `required:`, so folding it into `body:` does not
#    make `body:` required on `test` — only `requirement`/`bound` gain that.
#
#    `body: { required: true }` on these two is enforced as a *warning*, not
#    a build-blocking error the way `required: true` on an ordinary field
#    is — a requirement with no statement isn't one, but a stub still needs
#    to be able to exist while it's being drafted. Different severity than
#    their old `text: { required: true }` used to carry, on purpose.
#
#    `rationale`, `source`, `note`, and the log's `summary` all stay exactly
#    as they were: `rationale` because `required_when: {status: rejected}`
#    can require a field but not a paragraph sitting inside prose; `source`
#    and `note` because they are `on_change: log`, and folding either into
#    an `on_change: invalidate` field would silently make a provenance note
#    invalidate downstream links; the log's `summary` because it is
#    required, and log is not part of this change at all.
#
# v1 and v2 are untouched and still resolve exactly as they always have; a
# project pinned there sees no difference from any of this. `refdes standard
# upgrade --to 3` renames `text:`/`method:` to `body:` in every item file
# that still writes them (refusing, rather than silently merging, an item
# that already has separate body content of its own) and refuses, rolling
# back, if the result would not validate.

field_sets:
  provenance:
    source: { type: text, on_change: log }
    note:   { type: text, on_change: log }
    tags:   { type: list, on_change: ignore }
  stewardship:
    owner:         { type: person, on_change: log }
    last_reviewed: { type: date,   on_change: ignore }

link_types:
  # trace: false on amends/records/supersedes/addresses -- none of these is
  # "this item's correctness is justified by that one," which is what a
  # {{cascade}} block's default walk is for (docs/design/index-blocks.md §6).
  # Every other verb traces by default.
  refines:        { inverse: refined_by,    label: "Refines" }
  derives_from:   { inverse: derived_by,    label: "Derives from" }
  governed_by:    { inverse: governs,       label: "Governed by" }
  satisfies:      { inverse: satisfied_by,  label: "Satisfies" }
  constrained_by: { inverse: constrains,    label: "Constrained by" }
  verifies:       { inverse: verified_by,   label: "Verifies" }
  addresses:      { inverse: addressed_by,  label: "Addresses",   trace: false }
  records:        { inverse: recorded_by,   label: "Records",     trace: false }
  amends:         { inverse: amended_by,    label: "Amends",      trace: false }
  supersedes:     { inverse: superseded_by, label: "Supersedes",  trace: false }
  selects:        { inverse: selected_by,   label: "Selects" }
  blocked_by:     { inverse: blocks,        label: "Blocked by" }
  equivalent:     { inverse: equivalent,    label: "Equivalent" }   # self-inverse
  alternate:      { inverse: alternate,     label: "Alternate" }    # self-inverse

types:
  requirement:
    prefix: REQ
    label: Requirement
    preview: [status, title]
    coverable: true
    coverable_statuses: [active]
    fields:
      title:     { type: text, on_change: invalidate }
      status:    { type: enum, choices: [draft, active, retired], default: draft, on_change: invalidate }
      rationale: { type: text, on_change: invalidate }
    include: [provenance, stewardship]
    links:
      refines:     [requirement]
      governed_by: [requirement, bound]
    body: { on_change: invalidate, required: true }

  bound:
    prefix: BND
    label: Bound
    preview: [status, title, limit]
    coverable: true
    coverable_statuses: [active]
    fields:
      title:     { type: text, on_change: invalidate }
      limit:     { type: limit, required: true, on_change: invalidate }
      status:    { type: enum, choices: [draft, active, retired], default: draft, on_change: invalidate }
      rationale: { type: text, on_change: invalidate }
    include: [provenance, stewardship]
    links:
      refines:      [bound]
      derives_from: [requirement, bound]
    body: { on_change: invalidate, required: true }

  decision:
    prefix: DEC
    label: Decision
    preview: [status, title, date]
    satisfying_statuses: [accepted]
    check_severity: error
    fields:
      title:     { type: text, required: true, on_change: invalidate }
      status:    { type: enum, choices: [proposed, in_progress, accepted, on_hold, rejected, superseded],
                   default: proposed, on_change: invalidate }
      rationale: { type: text, on_change: invalidate, required_when: {status: rejected} }
      date:      { type: date, on_change: log }
      options:   { type: options, on_change: invalidate }
      checks:    { type: checks, on_change: invalidate }
    include: [provenance, stewardship]
    links:
      satisfies:      [requirement, bound]
      constrained_by: [bound]
      supersedes:     [decision]
      selects:        [component]
      blocked_by:     []   # empty target list = unrestricted
    body: { on_change: invalidate }

  test:
    prefix: TST
    label: Test
    preview: [status, title]
    verifying_statuses: [passing]
    fields:
      title:  { type: text, required: true, on_change: invalidate }
      status: { type: enum, choices: [planned, passing, failing, blocked], default: planned, on_change: invalidate }
    include: [provenance, stewardship]
    links:
      verifies: [requirement, bound]
    body: { on_change: invalidate }

  component:
    prefix: CMP
    label: Component
    preview: [status, title, part_number]
    satisfying_statuses: [selected]
    fields:
      title:       { type: text, required: true, on_change: invalidate }
      part_number: { type: text, on_change: invalidate }
      refdes:      { type: list, on_change: log }
      status:      { type: enum, choices: [candidate, selected, obsolete], default: candidate, on_change: invalidate }
      rationale:   { type: text, on_change: invalidate, required_when: {links: alternate} }
      datasheets:  { type: citations, on_change: invalidate }
      checks:      { type: checks, on_change: invalidate }
    include: [provenance, stewardship]
    links:
      satisfies:      [requirement, bound]
      constrained_by: [bound]
      equivalent:     [component]
      alternate:      [component]
    body: { on_change: invalidate }

  log:
    prefix: LOG
    label: Log entry
    plural: Log entries
    append_only: true
    preview: [date, author, summary]
    fields:
      date:    { type: date, required: true, on_change: invalidate }
      summary: { type: text, required: true, on_change: invalidate }
      author:  { type: person, on_change: invalidate }
    include: [provenance]
    links:
      addresses: [requirement, bound]
      amends:    [log]
      records:   [decision]
    body: { on_change: invalidate }
