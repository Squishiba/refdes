# The refdes standard dictionary — "hardware" base, version 3.
#
# Shipped inside the refdes package. Byte-identical forever once released: a
# project pinning `standard: {base: hardware, version: 3}` gets exactly this
# file, unchanged by any future refdes upgrade. See
# docs/design/standard-library.md for the full design discussion behind every
# choice here — this file is deliberately un-annotated beyond what a reader
# needs to trust that it matches the spec, since the spec is the place to
# argue about it, not this file.
#
# Changed from v2, in four parts, arriving together as one version because
# none was ever published on its own:
#
# 1. A new link verb: `governed_by` (inverse `governs`), authored on
#    `requirement`, targeting `[requirement, bound]`. Fills a real gap
#    `refines` and `constrained_by` both leave open: "this specific fact
#    must comply with a general rule stated elsewhere" is neither "a
#    narrower version of the same statement" (`refines` — same category of
#    thing, different altitude) nor "a machine-checkable numeric limit"
#    (`constrained_by` — the limit-bearing case, where a bound and `checks:`
#    are actually involved). Named and shaped to match the convention
#    `constrained_by`/`constrains` and `blocked_by`/`blocks` already
#    establish twice: authored from the *affected* item's side using the
#    passive form, with the active form computed as the backlink. Widened to
#    also target `bound` (not just `requirement`) for the same reason
#    `constrained_by` and `refines` both already do: a general rule worth
#    complying with is stated exactly as often as a bound as a requirement.
#
# 2. `satisfies` widens to `[requirement, bound]` on both `decision` and
#    `component` (was `[requirement]` on each) — a bound could be verified
#    or addressed, but never *satisfied*, which meant it could never be
#    fully covered by design work no matter how much existed. Coverage is
#    computed strictly from the `addressed_by`/`satisfied_by`/`verified_by`
#    backlinks (`build.compute_coverage`); `constrained_by`/`constrains`
#    contributes to none of them and stays a traceability-only edge (see
#    "Which links feed coverage" in docs/coverage.md) — this widening is
#    what actually closes the gap, not a documentation fix. `component`
#    also gains `constrained_by: [bound]` (it previously had no path to a
#    bound at all) and a `checks:` field, so a component can demonstrate
#    compliance with a bound directly rather than a `decision` having to be
#    invented purely to host the check.
#
# 3. `requirement.text` and `bound.text` merge into `body:` — not the
#    `requirement.text -> title` rename an earlier, retired proposal
#    considered, but a broader unification: `title` and `body` become the
#    only free-prose fields any type carries. `title` becomes OPTIONAL on
#    these two types, falling back exactly as `Item.title` already does for
#    every other type missing one — a requirement stays one field to write
#    (`body:` — see below), and gains a short label only when the sentence
#    is long enough to want one in a table. `test.method` folds into
#    `body:` too, on the same reasoning: free prose with nothing mechanical
#    depending on it, same role `body:` already plays everywhere else.
#    `method:` was never `required:`, so folding it into `body:` does not
#    make `body:` required on `test` — only `requirement`/`bound` gain that.
#
#    `body: { required: true }` on these two is enforced as a *warning*, not
#    a build-blocking error the way `required: true` on an ordinary field
#    is — a requirement with no statement isn't one, but a stub still needs
#    to be able to exist while it's being drafted. Different severity than
#    their old `text: { required: true }` used to carry, on purpose.
#
#    `rationale`, `source`, `note`, and the log's `summary` all stay exactly
#    as they were: `rationale` because `required_when: {status: rejected}`
#    can require a field but not a paragraph sitting inside prose; `source`
#    and `note` because they are `on_change: log`, and folding either into
#    an `on_change: invalidate` field would silently make a provenance note
#    invalidate downstream links; the log's `summary` because it is
#    required, and log is not part of this change at all.
#
# 4. A new type: `group` (prefix GRP) — names a collection of items as a
#    thing ("the PCIe interface spec") without letting that thing stand in
#    for its members. Membership is declared by the *member*, pointing at
#    the group with `part_of` (inverse `contains`, computed as the group's
#    backlink view); the group never lists its members, so a group can
#    never silently enlarge its own meaning as its contents grow. The two
#    properties this type exists to guarantee are negative ones: it is
#    `coverable: false` — a group never appears in coverage and never
#    acquires a coverage stage — and it is not a `satisfies:` target: the
#    `satisfies` target lists on `decision`/`component` stay
#    `[requirement, bound]`, so obligations are still discharged item by
#    item. A group that could be satisfied would silently discharge its
#    members' obligations — the group-reference failure mode this addition
#    was framed against (backlog finding 14, citing the DEC-IO-006
#    migration note). `part_of` is declared on requirement/bound/decision/
#    test/component — spec content — not on `log`, whose entries are records
#    of activity rather than things a spec group collects.
#
# 5. `equivalent` is renamed `drop_in`. `equivalent` is the industry word for
#    a drop-in second source, but sitting next to `alternate` it reads as the
#    weaker of the two — "sort of equivalent" — which is exactly backwards from
#    what the verbs mean, and the difference is safety-adjacent: the verb that
#    means "no review needed" has to be the one nobody can misread. `drop_in`
#    is the unambiguous phrase, so it goes on that verb; `alternate` keeps its
#    name and its weaker meaning. Nothing else about the pair changes: both
#    stay self-inverse, declared on `component`, restricted to `component`
#    targets, and `required_when: {links: alternate}` on `component.rationale`
#    is untouched. `refdes standard upgrade --to 3` rewrites every `equivalent:`
#    line to `drop_in:` (see migration.yaml); a project pinned at v3 that still
#    writes the old spelling gets a build error naming the new verb.
#
# v1 and v2 are untouched and still resolve exactly as they always have; a
# project pinned there sees no difference from any of this — including the
# `equivalent` verb, which v1 and v2 still spell `equivalent`. `refdes
# standard upgrade --to 3` renames `text:`/`method:` to `body:` and the
# `equivalent` link verb to `drop_in:` in every item file that still writes
# them (refusing, rather than silently merging, an item that already has
# separate body content of its own) and refuses, rolling back, if the result
# would not validate.

sets:
  provenance:
    fields:
      source: { type: text, on_change: log, doc: "Where the item's content came from — a spec section, a datasheet, a conversation. Kept out of the content hash, so correcting it never marks downstream items suspect." }
      note: { type: text, on_change: log, doc: "A free-text remark about the item's provenance, kept beside the item instead of inside its body. Kept out of the content hash." }
      tags: { type: list, on_change: ignore, doc: "Free-form labels for grouping and finding items; free-text search matches tags as well as titles. Kept out of the content hash." }
  stewardship:
    fields:
      owner: { type: person, on_change: log, doc: "The person responsible for this item — who a question about it goes to. Kept out of the content hash, so ownership changes never invalidate downstream work." }
      last_reviewed: { type: date, on_change: ignore, doc: "The date this item was last reviewed. Bookkeeping only: kept out of the content hash." }
  citations:
    fields:
      citations: { type: citations, on_change: invalidate, doc: "External documents this item relies on. Each entry needs a path — an http(s) URL or a project-root-relative file — and may carry rev, page, section, part_number, keep_copy and an id for [[cite:]] references." }
  statement_title:
    # The optional label of a prose-statement type (requirement, bound).
    # Each includer keeps its own wording with a doc-only patch
    # (docs/design/composition.md §3); this set's doc is never resolved
    # onto a type.
    fields:
      title: { type: text, on_change: invalidate, doc: "An optional short label for tables and previews. The item's content is the body, not this." }
  named_title:
    # The required one-line label of the naming types (decision, test,
    # component); each keeps its own wording via a doc-only patch (§3).
    fields:
      title: { type: text, required: true, on_change: invalidate, doc: "What this item is, in one line. Required." }
  grouped:
    # Spec content belongs to a group (composition.md §1.1). Not on log:
    # log entries are records of activity, not things a group collects.
    links:
      part_of: [group]
  claims:
    # Decisions and components discharge obligations the same way
    # (composition.md §1.1): they satisfy requirements/bounds and are
    # constrained by bounds.
    links:
      satisfies: [requirement, bound]
      constrained_by: [bound]
  invalidate_body:
    # Body edits invalidate downstream items (composition.md §1.2) — the
    # body of every prose type except requirement/bound (whose body is
    # required) and group (whose body is a log).
    body: { on_change: invalidate }

link_types:
  # trace: false on amends/records/supersedes/addresses -- none of these is
  # "this item's correctness is justified by that one," which is what a
  # {{cascade}} block's default walk is for (docs/design/index-blocks.md §6).
  # Every other verb traces by default.
  refines:        { inverse: refined_by,    label: "Refines", doc: "A narrower, more detailed version of the same kind of statement: a requirement refining a requirement, or a bound refining a bound. Same category of thing, different altitude." }
  derives_from:   { inverse: derived_by,    label: "Derives from", doc: "A bound whose value follows from a requirement or another bound — where the number came from, not a restatement of it." }
  governed_by:    { inverse: governs,       label: "Governed by", doc: "This requirement must comply with a general rule stated elsewhere — another requirement or a bound — without being a narrower version of it. Traceability only; it never feeds coverage." }
  satisfies:      { inverse: satisfied_by,  label: "Satisfies", doc: "A decision or component claims to meet a requirement or bound. This is the link that closes coverage once the claiming item reaches a satisfying status." }
  constrained_by: { inverse: constrains,    label: "Constrained by", doc: "A decision or component that must respect a bound. Traceability only — it does not close coverage on the bound; satisfies does." }
  verifies:       { inverse: verified_by,   label: "Verifies", doc: "A test proves a requirement or bound. Counts toward coverage when the test's status is one of the type's verifying_statuses." }
  addresses:      { inverse: addressed_by,  label: "Addresses",   trace: false, doc: "A log entry records work done on a requirement or bound. Counts as addressed coverage — someone has worked on it and written it up — without claiming it is met." }
  records:        { inverse: recorded_by,   label: "Records",     trace: false, doc: "A log entry records a decision — the design-log side of the decision's own recorded_by end of the same edge." }
  amends:         { inverse: amended_by,    label: "Amends",      trace: false, doc: "A log entry corrects an earlier log entry. Entries are append-only, so a correction is written as a new entry pointing back at this one rather than as an edit." }
  supersedes:     { inverse: superseded_by, label: "Supersedes",  trace: false, doc: "This decision replaces an older one. The older decision keeps its history; moving its status to superseded is your edit, not something the link does by itself. Because the two are separate claims, a build warns when this link says superseded and the target's status says something else." }
  selects:        { inverse: selected_by,   label: "Selects", doc: "A decision picks a component. The component's own status marks it selected; this link records which decision made the pick. A build warns when either half is missing and the other is not." }
  blocked_by:     { inverse: blocks,        label: "Blocked by", doc: "Something is holding this decision up. Name only the immediate blocker; reports resolve the chain to its root. May point at an item of any type; a cycle is a build error." }
  part_of:        { inverse: contains,      label: "Part of", doc: "This item belongs to a group. Membership is always declared by the member, never by the group; contains is the computed backlink." }
  drop_in:        { inverse: drop_in,       label: "Drop-in", doc: "This component is a drop-in second source for that one — interchangeable as claimed, no review needed. Self-inverse, and restricted to component-to-component. For a part that is close but needs checking before it goes in a design, use alternate." }
  alternate:      { inverse: alternate,     label: "Alternate", doc: "This component is functionally close to that one but not a drop-in: check before substituting. Self-inverse, component-to-component, and the rationale explaining what differs is required." }

types:
  requirement:
    doc: "Something the design must achieve, stated as one prose body. Counts toward coverage while active; a draft or retired requirement is left out of coverage entirely."
    prefix: REQ
    label: Requirement
    preview: [status, title]
    coverable: true
    coverable_statuses: [active]
    fields:
      title:     { doc: "An optional short label for tables and previews. The requirement's content is the body, not this." }
      status:    { type: enum, choices: [draft, active, retired], default: draft, on_change: invalidate, doc: "Lifecycle of the requirement. Only active requirements count toward coverage; draft and retired ones are excluded." }
      rationale: { type: text, on_change: invalidate, doc: "Why this requirement exists — the reasoning behind the statement, kept separate from the statement itself." }
    include: [provenance, stewardship, statement_title, grouped]
    links:
      refines:     [requirement]
      governed_by: [requirement, bound]
    body: { on_change: invalidate, required: true }

  bound:
    # A requirement with a number (docs/design/extends.md): the requirement's
    # fields, links, body, coverage flags and provenance/stewardship sets come
    # through `extends:`; what is written here is the delta. `title` is a
    # doc-only patch over the shared `statement_title` set (composition.md §3);
    # `status` and `rationale` are restated in full because their `doc:`
    # wording is the bound's own and an override through `extends:` replaces
    # the whole definition -- doc-only patches apply to includes, not to a
    # parent.
    extends: requirement
    doc: "A numeric limit the design must respect — a voltage, a current, a tolerance. Its limit field makes it checkable by other items' checks. Counts toward coverage while active."
    prefix: BND
    label: Bound
    plural: Bounds
    preview: [status, title, limit]
    fields:
      title:     { doc: "An optional short label for tables and previews. The bound's content is the body, not this." }
      limit:     { type: limit, required: true, on_change: invalidate, doc: "The numeric limit itself, parsed as a quantity with a comparison — '>= 9 V', '<= 600 mA'. Required, and it is what makes this bound checkable by other items' checks." }
      status:    { type: enum, choices: [draft, active, retired], default: draft, on_change: invalidate, doc: "Lifecycle of the bound. Only active bounds count toward coverage; draft and retired ones are excluded." }
      rationale: { type: text, on_change: invalidate, doc: "Why this limit is what it is — the reasoning behind the number." }
    include: [statement_title]
    links:
      refines:      [bound]
      derives_from: [requirement, bound]
      governed_by:  null   # un-declared: a bound is not governed_by-capable (keeps the resolved bound as it was)

  decision:
    doc: "A design choice that was made — what was picked, why, and what it satisfies. A settled (accepted) decision closes coverage on what it satisfies; a failing check on a decision is an error."
    prefix: DEC
    label: Decision
    preview: [status, title, date]
    satisfying_statuses: [accepted]
    check_severity: error
    fields:
      title:     { doc: "What was decided, in one line. Required — every decision needs a label." }
      status:    { type: enum, choices: [proposed, in_progress, accepted, on_hold, rejected, superseded],
                   default: proposed, on_change: invalidate, doc: "Where the decision stands. Only an accepted decision counts as settled and closes coverage on what it satisfies." }
      rationale: { type: text, on_change: invalidate, required_when: {status: rejected}, doc: "Why this decision, and why not the alternatives. Required when the decision is rejected — the reason a rejection happened is the point of recording it." }
      date:      { type: date, on_change: log, doc: "When the decision was made. Kept out of the content hash, so fixing a date never marks downstream items suspect." }
      options:   { type: options, on_change: invalidate, doc: "The alternatives considered, as name / verdict / because entries. Rendered as the options-considered panel on the decision's page." }
      checks:    { type: checks, on_change: invalidate, doc: "Numeric checks: each entry compares a value from this item's calc block against a bound's limit. A failed check here is reported as an error." }
    include: [provenance, stewardship, citations, named_title, grouped, claims, invalidate_body]
    links:
      supersedes:     [decision]
      selects:        [component]
      blocked_by:     []   # empty target list = unrestricted
      recorded_by:    [log]

  test:
    doc: "A verification item that proves a requirement or bound. Its verifies links count toward coverage when the test's status is passing."
    prefix: TST
    label: Test
    preview: [status, title]
    verifying_statuses: [passing]
    fields:
      title:  { doc: "What the test proves, in one line. Required." }
      status: { type: enum, choices: [planned, passing, failing, blocked], default: planned, on_change: invalidate, doc: "Result of the test. Only a passing test counts as having verified what it points at." }
    include: [provenance, stewardship, named_title, grouped, invalidate_body]
    links:
      verifies: [requirement, bound]

  component:
    doc: "A part the design uses. A selected component closes coverage on what it satisfies, and it can carry its own checks against bounds. Drop-in and alternate claims between components are made here, not facts from a parts database."
    prefix: CMP
    label: Component
    preview: [status, title, part_number]
    satisfying_statuses: [selected]
    check_severity: { candidate: info, selected: error, rejected: info, obsolete: info }
    fields:
      title:       { doc: "What the component is, in one line. Required." }
      part_number: { type: text, on_change: invalidate, doc: "The manufacturer part number. Indexed into the parts page, alongside part numbers cited inside citations entries." }
      refdes:      { type: list, on_change: log, doc: "Reference designators on the board — U14, R7 — where this part is placed. Kept out of the content hash." }
      status:      { type: enum, choices: [candidate, selected, rejected, obsolete], default: candidate, on_change: invalidate, doc: "Where the part stands in this design. Only a selected component counts as settled and closes coverage on what it satisfies; a rejected one was considered and not chosen, and never satisfies." }
      rationale:   { type: text, on_change: invalidate, required_when: {links: alternate}, doc: "Why this part, or — when an alternate link is present — what makes that alternate not a drop-in. Required whenever an alternate link exists." }
      checks:      { type: checks, on_change: invalidate, doc: "Numeric checks: each entry compares a value from this item's calc block against a bound's limit, so a component can demonstrate compliance with a bound directly." }
    include: [provenance, stewardship, citations, named_title, grouped, claims, invalidate_body]
    links:
      drop_in:        [component]
      alternate:      [component]

  # A named collection of items, not a thing that owes or discharges
  # obligations. `coverable: false` keeps it out of coverage entirely; it
  # is deliberately absent from every `satisfies:` target list, so nothing
  # may claim it. It declares no membership links of its own — members
  # point here with `part_of`, and `contains` is only ever the computed
  # inverse backlink (docs/design/backlog.md finding 14).
  group:
    doc: "A named collection of items — 'the PCIe interface spec' — that names the collection without letting it stand in for its members. Members point here with part_of; a group never lists its members, never appears in coverage, and nothing may satisfy one."
    prefix: GRP
    label: Group
    preview: [title]
    coverable: false
    fields:
      title: { type: text, required: true, on_change: log, doc: "The name of the collection. Required — an unnamed group names nothing. Kept out of the content hash, so renaming a group never marks its members suspect." }
    include: [provenance, stewardship]
    body: { on_change: log }

  log:
    doc: "A dated entry in the design log — work done, questions raised, corrections. Entries are append-only: each is sealed on the first build where it has no errors, and after that editing it is a build error — corrections are new entries with amends."
    prefix: LOG
    label: Log entry
    plural: Log entries
    append_only: true
    preview: [date, author, summary]
    fields:
      date:    { type: date, required: true, on_change: invalidate, doc: "When this entry was written. Required — an undated log entry cannot be ordered in time." }
      summary: { type: text, required: true, on_change: invalidate, doc: "One-line account of what happened, shown in log listings above the body." }
      author:  { type: person, on_change: invalidate, doc: "Who wrote the entry." }
    include: [provenance, invalidate_body]
    links:
      addresses: [requirement, bound]
      amends:    [log]
      records:   [decision]
