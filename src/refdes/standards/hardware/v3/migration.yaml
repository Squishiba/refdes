# The delta from hardware v2 to v3 -- what `refdes standard upgrade --to 3`
# applies to a project pinned at v2. Read by revise.py, never by base.yaml's
# own resolution: this file plays no part in what standard: {base: hardware,
# version: 3} resolves to; it only describes how a project already on v2
# moves its own existing content to match.
#
# v3's other changes -- the governed_by/governs link verb, satisfies
# widening to [requirement, bound] on decision/component, and component's
# new constrained_by/checks -- appear nowhere here. Those are purely
# additive (a widened target list or a new field/link accepts everything a
# narrower one already did), so nothing existing needs to be renamed for
# any of them to be usable.
#
# Not every v3 change is additive, though: citations moved from a field
# hardcoded onto component alone into a field set both component and
# decision include, under one field name, so a decision can cite a
# document too. That renames component's `datasheets:` to `citations:`,
# and this file rewrites it.
#
# fields: below renames text: -> body: on requirement/bound, method: ->
# body: on test, and datasheets: -> citations: on component -- exactly the
# same shape v1 -> v2's own migration.yaml used for constraint.title ->
# text. One difference from that rename worth calling out: `body:` is a reserved key, not a schema field, so revise.py
# additionally refuses (rather than silently overwriting) any item that
# already has body content of its own before this migration ever touches
# it -- see revise.check_body_merge_conflicts(), run alongside the ordinary
# ambiguity check every apply() already performs.
#
# citation_keys: below renames url: -> path: *inside* every citation entry
# (finding 25 Part 2): one field for "where the document is", dispatched on
# scheme. fields: cannot express this -- it renames item-level keys only and
# never sees inside a citations-typed field's entries -- so revise.py gained
# that category for exactly this blind spot.
#
# vendor: -> keep_copy: rides the same category (vocabulary-review.md S1):
# `vendor:` meant "keep a local copy of the fetched bytes", which a hardware
# engineer reads next to `part_number:` as the company that makes the part.
# It shipped under hardware@2 (v0.3.0-v0.5.0), so released projects can
# carry it; the owner approved the rename on 2026-09-20, choosing keep_copy:
#
# links: below renames the `equivalent` link verb to `drop_in` (the
# vocabulary review's P8): v2 ships `equivalent` meaning "drop-in second
# source", v3 spells that verb `drop_in` and leaves `equivalent` meaning
# nothing at all. This one is not optional in a way the additive v3 changes
# are: without it the step bumps the pin, re-validates, and passes -- an
# unknown link verb on an item is a warning, not an error, so every
# `equivalent:` line in the project silently stops being an edge while the
# project happily reports itself upgraded to v3. Verified by running the
# step against a v2 project that declares one.
#
# See docs/design/standard-library.md §3 for the versioning design this
# implements.

links:
  equivalent: drop_in

fields:
  requirement:   # keyed by the OLD type name
    text: body
  bound:
    text: body
  test:
    method: body
  component:
    datasheets: citations

citation_keys:
  url: path
  vendor: keep_copy
